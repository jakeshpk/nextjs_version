<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Four future electrical provisions worth discussing</title>
<desc id="desc">Four planning cards cover air conditioning, rooftop solar, electric vehicle charging and backup power. Each requires an engineering assessment.</desc>
<rect width="1200" height="720" fill="#f0f4ec"/>
<g font-family="Arial, sans-serif" fill="#153b3f">
<text x="60" y="60" font-size="16" letter-spacing="3">V4 BUILDING SOLUTIONS</text>
<text x="60" y="118" font-size="40" font-weight="700">Leave room for what comes next.</text>
<text x="60" y="154" font-size="20">Agree locations and routes before plastering. Design capacity separately.</text>
<g fill="#fff" stroke="#c9d8ce" stroke-width="2"><rect x="60" y="192" width="520" height="211" rx="18"/><rect x="620" y="192" width="520" height="211" rx="18"/><rect x="60" y="427" width="520" height="211" rx="18"/><rect x="620" y="427" width="520" height="211" rx="18"/></g>
<g fill="#2e756c"><rect x="91" y="225" width="66" height="37" rx="8"/><path d="M655 259L668 219H718L731 259Z"/><rect x="96" y="460" width="46" height="61" rx="7"/><rect x="654" y="471" width="68" height="39" rx="5"/></g>
<g fill="none" stroke="#fff" stroke-width="3"><path d="M102 249H146M670 240H717M693 221V257M108 476H130M108 487H130M669 490H683M676 483V497M697 490H709"/></g>
<g font-size="26" font-weight="700"><text x="179" y="254">Air conditioning</text><text x="750" y="254">Rooftop solar</text><text x="179" y="493">EV charging</text><text x="750" y="493">Backup power</text></g>
<g font-size="21"><text x="92" y="311">Choose likely equipment locations.</text><text x="92" y="346">Coordinate electrical and AC routes.</text><text x="652" y="311">Discuss roof-to-equipment routes.</text><text x="652" y="346">Reserve accessible equipment space.</text><text x="92" y="550">Identify the future parking position.</text><text x="92" y="585">Discuss a suitable cable pathway.</text><text x="652" y="550">List the essentials you want backed up.</text><text x="652" y="585">Agree an appropriate equipment area.</text></g>
<text x="60" y="684" font-size="17">A provision is not approval to connect: load, protection and supply must be assessed for the selected equipment.</text>
</g></svg>
