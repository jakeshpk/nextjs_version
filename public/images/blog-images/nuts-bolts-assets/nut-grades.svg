<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-label="Illustrated hexagonal nuts with property class marks 5, 8, 10 and 12"><rect width="1100" height="520" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#172b4d}.title{font-size:32px;font-weight:bold}.sub{font-size:22px}.small{font-size:18px}.metal{fill:#d6dee8;stroke:#566779;stroke-width:5}</style><text x="50" y="60" class="title">Common metric nut property classes</text><polygon points="262.3,287.5 180.0,335.0 97.7,287.5 97.7,192.5 180.0,145.0 262.3,192.5" class="metal"/><text x="180" y="252" text-anchor="middle" font-size="40" font-weight="bold">5</text><text x="180" y="380" text-anchor="middle" class="sub">Nut class 5</text><polygon points="512.3,287.5 430.0,335.0 347.7,287.5 347.7,192.5 430.0,145.0 512.3,192.5" class="metal"/><text x="430" y="252" text-anchor="middle" font-size="40" font-weight="bold">8</text><text x="430" y="380" text-anchor="middle" class="sub">Nut class 8</text><polygon points="762.3,287.5 680.0,335.0 597.7,287.5 597.7,192.5 680.0,145.0 762.3,192.5" class="metal"/><text x="680" y="252" text-anchor="middle" font-size="40" font-weight="bold">10</text><text x="680" y="380" text-anchor="middle" class="sub">Nut class 10</text><polygon points="1012.3,287.5 930.0,335.0 847.7,287.5 847.7,192.5 930.0,145.0 1012.3,192.5" class="metal"/><text x="930" y="252" text-anchor="middle" font-size="40" font-weight="bold">12</text><text x="930" y="380" text-anchor="middle" class="sub">Nut class 12</text><text x="50" y="470" class="small">Nut markings describe a nut property class, not a direct tensile strength in MPa.</text></svg>