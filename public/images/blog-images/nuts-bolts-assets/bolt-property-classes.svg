<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-label="Illustrated metric bolt heads stamped 4.6, 8.8, 10.9 and 12.9"><rect width="1100" height="520" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#172b4d}.title{font-size:32px;font-weight:bold}.sub{font-size:22px}.small{font-size:18px}.metal{fill:#d6dee8;stroke:#566779;stroke-width:5}</style><text x="50" y="60" class="title">Metric bolt head markings</text><polygon points="251.6,290.0 165.0,340.0 78.4,290.0 78.4,190.0 165.0,140.0 251.6,190.0" class="metal"/><text x="165" y="252" text-anchor="middle" font-size="40" font-weight="bold">4.6</text><text x="165" y="390" text-anchor="middle" class="sub">Class 4.6</text><polygon points="506.6,290.0 420.0,340.0 333.4,290.0 333.4,190.0 420.0,140.0 506.6,190.0" class="metal"/><text x="420" y="252" text-anchor="middle" font-size="40" font-weight="bold">8.8</text><text x="420" y="390" text-anchor="middle" class="sub">Class 8.8</text><polygon points="761.6,290.0 675.0,340.0 588.4,290.0 588.4,190.0 675.0,140.0 761.6,190.0" class="metal"/><text x="675" y="252" text-anchor="middle" font-size="40" font-weight="bold">10.9</text><text x="675" y="390" text-anchor="middle" class="sub">Class 10.9</text><polygon points="1016.6,290.0 930.0,340.0 843.4,290.0 843.4,190.0 930.0,140.0 1016.6,190.0" class="metal"/><text x="930" y="252" text-anchor="middle" font-size="40" font-weight="bold">12.9</text><text x="930" y="390" text-anchor="middle" class="sub">Class 12.9</text><text x="50" y="465" class="small">Illustrative head markings — actual appearance varies by manufacturer and size.</text></svg>