<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-label="Bar chart showing nominal tensile strengths 400, 500, 800, 1000 and 1200 MPa for classes 4.6, 5.6, 8.8, 10.9 and 12.9"><rect width="1100" height="520" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#172b4d}.title{font-size:32px;font-weight:bold}.sub{font-size:22px}.small{font-size:18px}.metal{fill:#d6dee8;stroke:#566779;stroke-width:5}</style><text x="50" y="60" class="title">Nominal tensile strength by metric property class</text><text x="80" y="152" class="sub">4.6</text><rect x="210" y="125" width="227" height="40" rx="6" fill="#326d9c"/><text x="457" y="152" class="sub">400 MPa</text><text x="80" y="226" class="sub">5.6</text><rect x="210" y="199" width="283" height="40" rx="6" fill="#326d9c"/><text x="513" y="226" class="sub">500 MPa</text><text x="80" y="300" class="sub">8.8</text><rect x="210" y="273" width="453" height="40" rx="6" fill="#326d9c"/><text x="683" y="300" class="sub">800 MPa</text><text x="80" y="374" class="sub">10.9</text><rect x="210" y="347" width="567" height="40" rx="6" fill="#326d9c"/><text x="797" y="374" class="sub">1000 MPa</text><text x="80" y="448" class="sub">12.9</text><rect x="210" y="421" width="680" height="40" rx="6" fill="#326d9c"/><text x="910" y="448" class="sub">1200 MPa</text></svg>