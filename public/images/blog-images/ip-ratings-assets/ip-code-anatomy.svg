<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="Anatomy of an Ingress Protection (IP) code showing IP65 breakdown">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="420" rx="16" fill="url(#bgGrad)"/>
  
  <style>
    .header-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 24px; font-weight: 700; fill: #f8fafc; }
    .header-sub { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 14px; fill: #94a3b8; }
    .badge-code { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 64px; font-weight: 900; }
    .card-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; }
    .card-body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #cbd5e1; line-height: 1.4; }
    .tag { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .note-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
  </style>

  <!-- Header -->
  <text x="50" y="52" class="header-title">Anatomy of an Ingress Protection (IP) Code</text>
  <text x="50" y="76" class="header-sub">Standardised enclosure classification under IEC 60529</text>

  <!-- Card 1: Prefix "IP" -->
  <g transform="translate(50, 105)" filter="url(#shadow)">
    <rect width="210" height="235" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="6" rx="3" fill="#64748b"/>
    <text x="105" y="80" text-anchor="middle" class="badge-code" fill="#94a3b8">IP</text>
    <rect x="55" y="105" width="100" height="22" rx="11" fill="#334155"/>
    <text x="105" y="120" text-anchor="middle" class="tag" fill="#cbd5e1">Code Prefix</text>
    <text x="105" y="152" text-anchor="middle" class="card-title" fill="#f8fafc">Ingress Protection</text>
    <text x="105" y="178" text-anchor="middle" class="card-body">Defines protection level</text>
    <text x="105" y="198" text-anchor="middle" class="card-body">of electrical enclosures</text>
    <text x="105" y="218" text-anchor="middle" class="card-body">against solids &amp; liquids</text>
  </g>

  <!-- Card 2: First Digit (Solids) -->
  <g transform="translate(290, 105)" filter="url(#shadow)">
    <rect width="320" height="235" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="6" rx="3" fill="#38bdf8"/>
    <text x="160" y="80" text-anchor="middle" class="badge-code" fill="#38bdf8">6</text>
    <rect x="85" y="105" width="150" height="22" rx="11" fill="#0369a1"/>
    <text x="160" y="120" text-anchor="middle" class="tag" fill="#e0f2fe">First Digit (0 – 6)</text>
    <text x="160" y="152" text-anchor="middle" class="card-title" fill="#38bdf8">Solid Objects &amp; Dust</text>
    <text x="160" y="178" text-anchor="middle" class="card-body">Protection against foreign solids</text>
    <text x="160" y="198" text-anchor="middle" class="card-body"><tspan font-weight="700" fill="#f8fafc">Digit 6 = Dust-Tight:</tspan> Complete</text>
    <text x="160" y="218" text-anchor="middle" class="card-body">vacuum-tested seal against dust entry</text>
  </g>

  <!-- Card 3: Second Digit (Water) -->
  <g transform="translate(640, 105)" filter="url(#shadow)">
    <rect width="310" height="235" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <rect x="0" y="0" width="310" height="6" rx="3" fill="#818cf8"/>
    <text x="155" y="80" text-anchor="middle" class="badge-code" fill="#818cf8">5</text>
    <rect x="80" y="105" width="150" height="22" rx="11" fill="#4338ca"/>
    <text x="155" y="120" text-anchor="middle" class="tag" fill="#e0e7ff">Second Digit (0 – 9)</text>
    <text x="155" y="152" text-anchor="middle" class="card-title" fill="#a5b4fc">Water &amp; Moisture</text>
    <text x="155" y="178" text-anchor="middle" class="card-body">Protection against harmful liquid entry</text>
    <text x="155" y="198" text-anchor="middle" class="card-body"><tspan font-weight="700" fill="#f8fafc">Digit 5 = Water Jets:</tspan> Water</text>
    <text x="155" y="218" text-anchor="middle" class="card-body">projected by a nozzle (6.3mm) from any side</text>
  </g>

  <!-- Bottom Clarification Footnote -->
  <g transform="translate(50, 365)">
    <rect width="900" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="20" cy="17" r="8" fill="#0284c7"/>
    <text x="20" y="21" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">i</text>
    <text x="36" y="21" class="note-text">
      <tspan font-weight="bold" fill="#f8fafc">Key Rule:</tspan> Read digits independently. An "X" means unspecified (e.g. IPX4). Immersion ratings (IP67/IP68) do not automatically include jet ratings (IP66).
    </text>
  </g>
</svg>
