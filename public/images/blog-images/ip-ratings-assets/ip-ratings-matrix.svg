<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-label="Comparison of common IP ratings for electrical fixtures, lights, and panel boards">
  <defs>
    <linearGradient id="matrixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="softCard" x="-2%" y="-4%" width="104%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1100" height="620" rx="16" fill="url(#matrixBg)" stroke="#e2e8f0" stroke-width="2"/>

  <style>
    .m-title { font-family: system-ui, -apple-system, sans-serif; font-size: 24px; font-weight: 800; fill: #0f172a; }
    .m-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #64748b; }
    .th { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #475569; text-transform: uppercase; letter-spacing: 0.5px; }
    .r-code { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 800; }
    .r-name { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; }
    .r-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
    .badge-app { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; }
  </style>

  <!-- Title Section -->
  <text x="45" y="48" class="m-title">Common IP Ratings at a Glance</text>
  <text x="45" y="72" class="m-sub">Selecting appropriate ingress protection for lighting, distribution boards and accessories</text>

  <!-- Table Headers -->
  <g transform="translate(45, 96)">
    <rect width="1010" height="36" rx="6" fill="#e2e8f0"/>
    <text x="25" y="23" class="th">Rating</text>
    <text x="130" y="23" class="th">Solids (Dust) Protection</text>
    <text x="400" y="23" class="th">Liquids (Water) Protection</text>
    <text x="680" y="23" class="th">Typical Building Applications</text>
    <text x="930" y="23" class="th">Outdoor Use?</text>
  </g>

  <!-- Row 1: IP20 -->
  <g transform="translate(45, 142)" filter="url(#softCard)">
    <rect width="1010" height="66" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="0" y="0" width="6" height="66" rx="3" fill="#94a3b8"/>
    <rect x="18" y="16" width="70" height="34" rx="6" fill="#f1f5f9"/>
    <text x="53" y="39" text-anchor="middle" class="r-code" fill="#475569">IP20</text>
    <text x="130" y="29" class="r-name">Fingers &amp; objects &gt;12.5 mm</text>
    <text x="130" y="47" class="r-desc">Prevents accidental touch by fingers</text>
    <text x="400" y="29" class="r-name">No water protection (0)</text>
    <text x="400" y="47" class="r-desc">Zero resistance against moisture or drips</text>
    <text x="680" y="38" class="r-desc">Dry living spaces, bedrooms, indoor offices</text>
    <rect x="915" y="20" width="78" height="26" rx="13" fill="#fee2e2"/>
    <text x="954" y="37" text-anchor="middle" class="badge-app" fill="#b91c1c">Indoor Only</text>
  </g>

  <!-- Row 2: IP44 -->
  <g transform="translate(45, 218)" filter="url(#softCard)">
    <rect width="1010" height="66" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="0" y="0" width="6" height="66" rx="3" fill="#38bdf8"/>
    <rect x="18" y="16" width="70" height="34" rx="6" fill="#e0f2fe"/>
    <text x="53" y="39" text-anchor="middle" class="r-code" fill="#0284c7">IP44</text>
    <text x="130" y="29" class="r-name">Tools &amp; wires &gt;1.0 mm</text>
    <text x="130" y="47" class="r-desc">Prevents wire and small tool entry</text>
    <text x="400" y="29" class="r-name">Splashing water from any side</text>
    <text x="400" y="47" class="r-desc">Protected against casual water splashes</text>
    <text x="680" y="38" class="r-desc">Bathroom Zone 2, covered porches, sheltered balconies</text>
    <rect x="915" y="20" width="78" height="26" rx="13" fill="#fef3c7"/>
    <text x="954" y="37" text-anchor="middle" class="badge-app" fill="#b45309">Sheltered</text>
  </g>

  <!-- Row 3: IP54 / IP55 -->
  <g transform="translate(45, 294)" filter="url(#softCard)">
    <rect width="1010" height="66" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="0" y="0" width="6" height="66" rx="3" fill="#0284c7"/>
    <rect x="18" y="16" width="70" height="34" rx="6" fill="#e0f2fe"/>
    <text x="53" y="39" text-anchor="middle" class="r-code" fill="#0369a1">IP55</text>
    <text x="130" y="29" class="r-name">Dust protected (limited entry)</text>
    <text x="130" y="47" class="r-desc">Dust ingress won't interfere with safety</text>
    <text x="400" y="29" class="r-name">Low-pressure water jets</text>
    <text x="400" y="47" class="r-desc">Protected from nozzle water jets (6.3mm)</text>
    <text x="680" y="38" class="r-desc">Covered carports, semi-outdoor panels, corridors</text>
    <rect x="915" y="20" width="78" height="26" rx="13" fill="#dcfce7"/>
    <text x="954" y="37" text-anchor="middle" class="badge-app" fill="#15803d">Semi-Outdoor</text>
  </g>

  <!-- Row 4: IP65 / IP66 -->
  <g transform="translate(45, 370)" filter="url(#softCard)">
    <rect width="1010" height="66" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="66" rx="3" fill="#0284c7"/>
    <rect x="18" y="16" width="70" height="34" rx="6" fill="#0284c7"/>
    <text x="53" y="39" text-anchor="middle" class="r-code" fill="#ffffff">IP65</text>
    <text x="130" y="29" class="r-name">Dust-tight (complete seal)</text>
    <text x="130" y="47" class="r-desc">Zero dust ingress under vacuum test</text>
    <text x="400" y="29" class="r-name">Water jets (IP65) / Powerful jets (IP66)</text>
    <text x="400" y="47" class="r-desc">Withstands driving rain and pressure hose washing</text>
    <text x="680" y="38" class="r-desc">Exposed outdoor lighting, monsoon wall fittings, outdoor DBs</text>
    <rect x="915" y="20" width="78" height="26" rx="13" fill="#dcfce7"/>
    <text x="954" y="37" text-anchor="middle" class="badge-app" fill="#15803d">Outdoor Ready</text>
  </g>

  <!-- Row 5: IP67 -->
  <g transform="translate(45, 446)" filter="url(#softCard)">
    <rect width="1010" height="66" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="0" y="0" width="6" height="66" rx="3" fill="#6366f1"/>
    <rect x="18" y="16" width="70" height="34" rx="6" fill="#e0e7ff"/>
    <text x="53" y="39" text-anchor="middle" class="r-code" fill="#4338ca">IP67</text>
    <text x="130" y="29" class="r-name">Dust-tight (complete seal)</text>
    <text x="130" y="47" class="r-desc">Zero dust ingress</text>
    <text x="400" y="29" class="r-name">Temporary immersion (up to 1m)</text>
    <text x="400" y="47" class="r-desc">Safe against immersion for 30 minutes</text>
    <text x="680" y="38" class="r-desc">Recessed ground lights, driveway burial fixtures, flood areas</text>
    <rect x="915" y="20" width="78" height="26" rx="13" fill="#dcfce7"/>
    <text x="954" y="37" text-anchor="middle" class="badge-app" fill="#15803d">Submersible*</text>
  </g>

  <!-- Row 6: IP68 -->
  <g transform="translate(45, 522)" filter="url(#softCard)">
    <rect width="1010" height="66" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="0" y="0" width="6" height="66" rx="3" fill="#4338ca"/>
    <rect x="18" y="16" width="70" height="34" rx="6" fill="#312e81"/>
    <text x="53" y="39" text-anchor="middle" class="r-code" fill="#ffffff">IP68</text>
    <text x="130" y="29" class="r-name">Dust-tight (complete seal)</text>
    <text x="130" y="47" class="r-desc">Zero dust ingress</text>
    <text x="400" y="29" class="r-name">Continuous immersion under water</text>
    <text x="400" y="47" class="r-desc">Depth and duration defined by manufacturer</text>
    <text x="680" y="38" class="r-desc">Swimming pool luminaires, water fountain lights, sump pumps</text>
    <rect x="915" y="20" width="78" height="26" rx="13" fill="#dbeafe"/>
    <text x="954" y="37" text-anchor="middle" class="badge-app" fill="#1d4ed8">Underwater</text>
  </g>
</svg>
